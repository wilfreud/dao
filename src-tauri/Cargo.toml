[package]
name = "dao"
version = "0.1.0"
description = "A local-first desktop developer workbench"
authors = ["https://commodore64.dev"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
tower-http = { version = "0.7.1", features = ["limit"] }
thiserror = "2.0.21"
local-ip-address = "0.6.13"
sanitize-filename = "0.6.0"
tempfile = "3.27.0"
netstat2 = "0.11"
sysinfo = "0.39"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["multipart"] }
